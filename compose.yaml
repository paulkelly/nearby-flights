# The whole app: nginx (web) in front of the API, plus Redis, Postgres (and optionally Seq for logs).
# Needs a .env file next to this one with POSTGRES_PASSWORD set (copy .env.example).
#   docker compose up --build                   build images and start, then open http://localhost:8080
#   docker compose down                         stop and remove the containers and network
#   docker compose --profile logs up --build    the same plus Seq at http://localhost:5341
#   docker compose --profile logs down          stop that: a plain `down` skips profile services like Seq
#                                               (and then can't remove the network they're still using)
#   add -v to `down` to also delete volumes (saved locations in Postgres, Seq's stored logs)
#
# Compose creates a private network for these services, and each service's name becomes its DNS name on it.
# That's how nginx reaches the API at http://api:8080 (the default API_URL baked into the web image).

name: flightradar # project name: prefixes containers (flightradar-api-1) and the network (flightradar_default)

services:
  api:
    image: flightradar-api
    build:
      # Context is the repo root so the build can see FlightRadar.Core and Directory.Build.props.
      # src/FlightRadar.Api/Dockerfile.dockerignore limits what is actually sent.
      context: .
      dockerfile: src/FlightRadar.Api/Dockerfile
    environment:
      # "__" stands for ":" in env var names, so this is ConnectionStrings:Redis. "redis" is the service name below.
      # Remove it and the API runs on its in-memory cache alone.
      ConnectionStrings__Redis: redis:6379
      # Structured logs also go to Seq (below). Only started with `--profile logs`; without it this address
      # doesn't resolve and the sink quietly drops its batches, so the API is unaffected.
      Seq__ServerUrl: http://seq:5341
      # Trust X-Forwarded-For/-Proto from this Compose network (where nginx is), so the API logs and rate-limits
      # the real client rather than nginx. Must match the subnet pinned under `networks:` at the bottom.
      ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
      # From .env (git-ignored; see .env.example). ${VAR:-} means "empty if not set", so all of these are optional.
      # Secrets are passed as environment variables like this, never written into compose.yaml or appsettings.
      Providers__Active: ${FLIGHT_PROVIDER:-AdsbLol}
      Providers__Fallback: ${FLIGHT_FALLBACK:-}
      Providers__OpenSky__ClientId: ${OPENSKY_CLIENT_ID:-}
      Providers__OpenSky__ClientSecret: ${OPENSKY_CLIENT_SECRET:-}
      # Saved locations. "postgres" is the service name below; the password comes from .env.
      ConnectionStrings__Postgres: Host=postgres;Database=flightradar;Username=flightradar;Password=${POSTGRES_PASSWORD}
    depends_on:
      redis:
        # Wait until Redis's health check passes, not just until its container has started. The API copes without
        # Redis anyway; this just avoids a burst of "cache backend" errors in the logs on every startup.
        condition: service_healthy
      migrate:
        # Start only after the schema is up to date: `migrate` must have run and exited with code 0. If a migration
        # fails, the API isn't started at all (see `docker compose logs migrate`).
        condition: service_completed_successfully
    restart: unless-stopped
    # No `ports:` on purpose. The API is reachable only from other services on this network, so everything
    # from outside goes through nginx. That (plus no container_name) is also what lets it scale:
    # `docker compose up --scale api=2` starts two instances, nginx spreads requests across them, and they
    # share one cache through Redis.

  web:
    image: flightradar-web
    build:
      context: web
    ports:
      # host:container. The host side can be changed without editing this file, e.g. WEB_PORT=9090 in a
      # .env file next to compose.yaml or in the shell's environment. ${VAR:-default} is Compose syntax.
      - "${WEB_PORT:-8080}:8080"
    # Start once the API reports healthy (its HEALTHCHECK is in the API's Dockerfile), so the first page load
    # doesn't hit a 502 while the API is still starting. nginx copes either way: it resolves the API per request.
    depends_on:
      api:
        condition: service_healthy
    # nginx's Alpine image does have wget, so this one is the usual one-liner.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Log viewer (stage 5d), optional: `docker compose --profile logs up -d`, then http://localhost:5341.
  # Search and filter structured logs by their properties, e.g. ElapsedMs > 500 or StatusCode = 502.
  # Seq is free for individual use; the official image needs the licence accepted explicitly.
  seq:
    image: datalust/seq:2026.1
    profiles: ["logs"] # not started by a plain `docker compose up`
    environment:
      ACCEPT_EULA: "Y"
      # Local learning setup: no login. Fine only because the port below is bound to 127.0.0.1.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # Container port 80 serves the UI and accepts log events; port 5341 accepts log events only (the API uses
      # that one). Publishing 80 as 5341 on the host means one address for both: the browser and a Rider run.
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data # keeps logs across restarts; `docker compose down -v` deletes them
    restart: unless-stopped

  # One-off job: brings the database schema up to date (EF Core migrations), then exits. Runs on every `up`;
  # when there's nothing new it just says so. Built from the API's Dockerfile, stopping at its `migrate` stage.
  migrate:
    image: flightradar-migrate
    build:
      context: .
      dockerfile: src/FlightRadar.Api/Dockerfile
      target: migrate
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=flightradar;Username=flightradar;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no" # a job, not a server: exiting is success, not something to restart

  # The database (step 7): what users keep, unlike Redis, which only caches. Data lives in the postgres-data volume,
  # so it survives `docker compose down` (but not `down -v`). Hands-on: docs/postgres-lab.md.
  postgres:
    image: postgres:18-alpine # the official image, pinned to a major version: minor releases are bug fixes only
    environment:
      # The image creates this database and user on its first start (when the volume is empty) only. Changing the
      # password here later doesn't change it in the database.
      POSTGRES_DB: flightradar
      POSTGRES_USER: flightradar
      # Required: `docker compose up` stops with this message if .env doesn't set it. Never write it in this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env next to compose.yaml (see .env.example)}
    volumes:
      # Postgres 18+ images keep their data in a version-named folder under /var/lib/postgresql, so mount that.
      - postgres-data:/var/lib/postgresql
    ports:
      # For psql, Rider's database tool and Rider runs of the API. Only this machine, like Redis.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--username=flightradar", "--dbname=flightradar"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Shared cache (stage 5c). Optional: the API runs without it, using its in-memory cache only.
  # Hands-on exercises: docs/redis-lab.md.
  redis:
    image: redis:8.10-alpine # the official image, pinned to a minor version like nginx
    command:
      - redis-server
      - --maxmemory
      - 32mb # hard cap; a cache should never be able to eat the machine
      - --maxmemory-policy
      - allkeys-lru # when full, evict the least recently used key (any key) to make room
      - --save
      - "" # no RDB snapshots...
      - --appendonly
      - "no" # ...and no append-only log: it's a cache, so starting empty after a restart is fine
    ports:
      # Published so you (redis-cli, Rider runs of the API) can reach it, but bound to 127.0.0.1: only this
      # machine can connect, not the rest of the LAN. There's no password, so never publish it more widely.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # Docker runs this inside the container; "healthy" means Redis answered PONG. Shown in `docker compose ps`,
    # and lets other services wait for Redis to be ready (not just started) with `condition: service_healthy`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  seq-data:

# Compose's network normally gets whichever subnet Docker picks. Pinning it means the API can be told exactly which
# addresses are its proxies (ForwardedHeaders__KnownNetworks__0 above). If this range clashes with another network
# on your machine, change both. After changing it, run docker compose down once so the network is recreated.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
