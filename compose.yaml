# The whole app: nginx (web) in front of the API, plus Redis.
#   docker compose up --build      build images and start, then open http://localhost:8080
#   docker compose down            stop and remove the containers and network
#
# Compose creates a private network for these services, and each service's name becomes its DNS name on it.
# That's how nginx reaches the API at http://api:8080 (the default API_URL baked into the web image).

name: flightradar # project name: prefixes containers (flightradar-api-1) and the network (flightradar_default)

services:
  api:
    image: flightradar-api
    build:
      # Context is the repo root so the build can see FlightRadar.Core and Directory.Build.props.
      # src/FlightRadar.Api/Dockerfile.dockerignore limits what is actually sent.
      context: .
      dockerfile: src/FlightRadar.Api/Dockerfile
    environment:
      # "__" stands for ":" in env var names, so this is ConnectionStrings:Redis. "redis" is the service name below.
      # Remove it and the API runs on its in-memory cache alone.
      ConnectionStrings__Redis: redis:6379
    depends_on:
      redis:
        # Wait until Redis's health check passes, not just until its container has started. The API copes without
        # Redis anyway; this just avoids a burst of "cache backend" errors in the logs on every startup.
        condition: service_healthy
    restart: unless-stopped
    # No `ports:` on purpose. The API is reachable only from other services on this network, so everything
    # from outside goes through nginx. That (plus no container_name) is also what lets it scale:
    # `docker compose up --scale api=2` starts two instances, nginx spreads requests across them, and they
    # share one cache through Redis.

  web:
    image: flightradar-web
    build:
      context: web
    ports:
      # host:container. The host side can be changed without editing this file, e.g. WEB_PORT=9090 in a
      # .env file next to compose.yaml or in the shell's environment. ${VAR:-default} is Compose syntax.
      - "${WEB_PORT:-8080}:8080"
    # Start the API first. This controls start *order* only, not "wait until the API is ready"; that needs a
    # health check (roadmap step 5). nginx copes either way: it resolves the API per request and returns 502
    # until it's up.
    depends_on:
      - api
    restart: unless-stopped

  # Shared cache (stage 5c). Optional: the API runs without it, using its in-memory cache only.
  # Hands-on exercises: docs/redis-lab.md.
  redis:
    image: redis:8.10-alpine # the official image, pinned to a minor version like nginx
    command:
      - redis-server
      - --maxmemory
      - 32mb # hard cap; a cache should never be able to eat the machine
      - --maxmemory-policy
      - allkeys-lru # when full, evict the least recently used key (any key) to make room
      - --save
      - "" # no RDB snapshots...
      - --appendonly
      - "no" # ...and no append-only log: it's a cache, so starting empty after a restart is fine
    ports:
      # Published so you (redis-cli, Rider runs of the API) can reach it, but bound to 127.0.0.1: only this
      # machine can connect, not the rest of the LAN. There's no password, so never publish it more widely.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    # Docker runs this inside the container; "healthy" means Redis answered PONG. Shown in `docker compose ps`,
    # and lets other services wait for Redis to be ready (not just started) with `condition: service_healthy`.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
