# Continuous integration: on every push to main and every pull request into it, a fresh GitHub-hosted machine
# builds and tests everything. Jobs run in parallel, each on its own clean runner; a pull request can only be merged
# when they all pass (branch protection on main lists them as required checks).
#
# Actions are pinned to a full commit SHA, with the version it was tagged as in a comment. A tag like v6 can be moved
# to point at different code (by the action's owner, or by whoever steals their account); a commit SHA can't.
# Dependabot keeps the SHAs (and the comments) up to date.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The GITHUB_TOKEN every job gets: read-only unless a job asks for more.
permissions:
  contents: read

# A newer push to a pull request cancels the run still going for the older one. Runs on main are never cancelled:
# that could stop a publish halfway, with some images pushed for a commit and others not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      # Downloaded NuGet packages, reused while no project file changes (the key is a hash of them).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build --configuration Release
      # Everything that needs no Docker: quick, so it reports first.
      - run: dotnet test --configuration Release --no-build --filter "Category!=Database"

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build --configuration Release
      # Postgres and Redis tests: Testcontainers starts real containers on the runner's Docker.
      - run: dotnet test --configuration Release --no-build --filter "Category=Database"

  # The web app: install exactly what package-lock.json says, lint, unit tests, then type-check + production build.
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Buildx = BuildKit, Docker's newer builder: needed for the layer cache below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each image keeps its layers in GitHub's Actions cache (type=gha), in its own scope so they don't evict each
      # other. Unchanged layers (the SDK, `dotnet restore`, `npm ci`) are then reused instead of rebuilt.
      # `load` puts the image into the runner's Docker under the name compose.yaml uses, for the smoke test below.
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/FlightRadar.Api/Dockerfile
          load: true
          tags: flightradar-api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      # The migration bundle is a stage before the API's final one, so building the API doesn't build it.
      - name: Build the migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/FlightRadar.Api/Dockerfile
          target: migrate
          load: true
          tags: flightradar-migrate
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          load: true
          tags: flightradar-web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Smoke test: the whole stack from compose.yaml, started from the images just built. Proves that they run
      # together: migrations apply, every health check passes, nginx reaches the API, the API reaches Postgres.
      # It never asks for flights, so it sends nothing to adsb.lol.
      - name: Create a throwaway .env
        # A random password for a database that lives for a few minutes on a machine that's then thrown away.
        # Letters and digits only, like the real one (it sits in a connection string).
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
      - name: Start the stack
        # --wait: return once `migrate` has exited with 0 and every service with a health check reports healthy;
        # fail if anything exits with an error or isn't healthy in time. --no-build: test the images built above.
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          # The web app's page (index.html, served by nginx).
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet '<div id="root">'
          # A new owner: nginx -> API -> Postgres, through the tables the migrations created. Answers 503 without them.
          token=$(curl --fail --silent --show-error --request POST http://localhost:8080/api/owners | jq --raw-output .token)
          # The owner token works, and a new owner has no saved locations.
          curl --fail --silent --show-error --header "Authorization: Bearer $token" http://localhost:8080/api/locations \
            | jq --exit-status 'length == 0'
      - name: Show the stack's logs
        if: failure() # only when an earlier step failed: that's when they're needed
        run: |
          docker compose ps --all
          docker compose logs --no-color

  # Publish the images to GitHub Container Registry, so a host can pull exactly what passed CI:
  #   ghcr.io/paulkelly/nearby-flights/{api,migrate,web}:sha-<first 7 of the commit>  (immutable: what deploys use)
  #                                                     :latest                       (the newest from main)
  # Newly created packages are private: each one is made public once, by hand, in its package settings.
  publish:
    name: Publish ${{ matrix.image }}
    needs: [backend, database, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A matrix runs this job once per entry, in parallel: three copies of the same steps, one per image.
    strategy:
      matrix:
        include:
          - image: api
            context: .
            file: src/FlightRadar.Api/Dockerfile
            target: final
          - image: migrate
            context: .
            file: src/FlightRadar.Api/Dockerfile
            target: migrate
          - image: web
            context: web
            file: web/Dockerfile
            target: final
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
      KEEP_VERSIONS: 10 # older versions are deleted after each publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The workflow's own short-lived token is enough for this repository's packages: no secret to store.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Works out the tags, plus standard OCI labels: the source repository (which links the package to this repo
      # on GitHub), the commit, and when it was built.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      # Same Dockerfiles as the Docker job, so its layer cache makes this mostly a push.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          # One plain image per push. BuildKit's own provenance/SBOM would wrap it in an index with extra untagged
          # manifests, which the clean-up below could delete out from under a kept image. Provenance comes from
          # the attestation step instead.
          provenance: false
          sbom: false
      # A signed statement "this image digest was built from this commit by this workflow", kept by GitHub.
      # Check one with: gh attestation verify oci://ghcr.io/paulkelly/nearby-flights/api:latest --owner paulkelly
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
      # Keep the newest KEEP_VERSIONS versions of this image, delete the rest. Public packages are stored free, so
      # this is only tidiness. The package's name contains a "/", which must be written %2F in the API's URL.
      - name: Delete old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: nearby-flights%2F${{ matrix.image }}
        run: |
          versions="/users/${{ github.repository_owner }}/packages/container/$PACKAGE/versions"
          gh api --paginate "$versions" \
            | jq --slurp --raw-output "add | sort_by(.created_at) | reverse | .[$KEEP_VERSIONS:] | .[].id" \
            | while read -r id; do
                echo "Deleting version $id"
                gh api --method DELETE "$versions/$id"
              done
